---
- name: Clone/update ESPHome modular LVGL buttons repo
  hosts: all

  vars:
    esphome_data_path: /srv/dvls/esphome-data
    repo_url: https://github.com/VladStPetre/esphome-lvgl
    repo_dest: "{{ esphome_data_path }}/esphome-lvgl"

  tasks:
    - name: Ensure ESPHome data directory exists
      ansible.builtin.file:
        path: "{{ esphome_data_path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Clone or update esphome-lvgl
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: main
        update: true
        force: true

    - name: Copy wallpaper
      ansible.builtin.copy:
        src: ../../pictures/red-lines-wallpaper-1024x600.jpg  # path relative to playbook
        dest: "{{ esphome_data_path }}/wallpapers/red-lines-wallpaper-1024x600.jpg"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"